name: Android profile dependency diagnostics

on:
  push:
    branches: [fix/scrum-430-hosted-builds]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile-classpaths:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true
      - run: flutter pub get
      - name: Prepare synthetic Android configuration
        run: |
          python3 tool/prepare_native_ci.py android
          printf '\norg.gradle.workers.max=2\norg.gradle.daemon=false\nkotlin.compiler.execution.strategy=in-process\n' >> android/gradle.properties
          if [ ! -f android/local.properties ]; then
            echo "flutter.sdk=$(dirname "$(dirname "$(readlink -f "$(command -v flutter)")")")" > android/local.properties
            echo "sdk.dir=$ANDROID_HOME" >> android/local.properties
          fi
      - name: Compare generated plugins with profile compile/runtime classpaths
        working-directory: android
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          info = json.loads(Path('../.flutter-plugins-dependencies').read_text())
          names = [x['name'] for x in info.get('plugins', {}).get('android', [])]
          print('PLUGIN_METADATA_ANDROID_COUNT:', len(names))
          print('PLUGIN_METADATA_ANDROID_NAMES:', ', '.join(names))
          PY
          ./gradlew projects --console=plain --no-daemon > "$RUNNER_TEMP/gradle-projects.txt" 2>&1
          grep -E "^Project |^\\+--- Project|^\\--- Project|^Root project|^\\|" "$RUNNER_TEMP/gradle-projects.txt" | head -90 || true
          for kind in Compile Runtime; do
            config="productionProfile${kind}Classpath"
            ./gradlew :app:dependencies --configuration "$config" --console=plain --no-daemon > "$RUNNER_TEMP/${config}.txt" 2>&1
            echo "=== $config: projects linked ==="
            grep -E "project :(firebase|device_info|package_info|share_plus|shared_preferences|url_launcher|app_settings|google_sign_in|flutter_plugin|jni_flutter|sign_in_with_apple|freerasp|patrol)" "$RUNNER_TEMP/${config}.txt" | head -100 || true
            echo "=== $config: all plugin project refs ==="
            grep -E -m 80 'project :' "$RUNNER_TEMP/${config}.txt" || true
          done
          echo "=== profile variant fallback ==="
          ./gradlew :app:properties --console=plain --no-daemon | grep -E 'buildType|profile|runtimeClasspath' | head -25 || true
