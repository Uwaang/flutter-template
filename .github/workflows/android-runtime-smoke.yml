name: Android Runtime Smoke PoC (SCRUM-435)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-runtime-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  startup:
    name: Android profile APK reaches mock authentication
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      FLUTTER_TEMPLATE_COMPILE_ONLY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Gradle wrapper validation and cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true
      - run: flutter pub get
      - run: dart run tool/create_ci_env.dart
      - run: python3 tool/prepare_native_ci.py android
      - name: Provide valid debug signing hash to freeRASP
        run: python3 qa/mobile/prepare_ci_env.py
      - run: flutter gen-l10n --arb-dir assets/localization --template-arb-file app_en.arb --output-localization-file app_localizations.gen.dart --output-dir lib/assets
      - run: dart run build_runner build --delete-conflicting-outputs

      - name: Build synthetic debug-signed Android profile APK
        run: flutter build apk --profile -t lib/main_production.dart --flavor production
      - name: Upload built APK for manual device test (independent of emulator smoke)
        uses: actions/upload-artifact@v4
        with:
          name: qa-android-profile-apk-manual-device-test
          path: build/app/outputs/flutter-apk/app-production-profile.apk
          if-no-files-found: error
          retention-days: 7
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify one real Android startup screen
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: bash qa/mobile/run_once.sh
      - name: Upload screen and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-android-first-screen-evidence
          path: qa/mobile/evidence/
          if-no-files-found: warn
          retention-days: 7
