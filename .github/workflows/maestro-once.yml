name: One-time Android emulator health baseline (SCRUM-435)

on:
  push:
    branches: [qa/scrum-435-maestro-android-once]
    paths:
      - .github/workflows/maestro-once.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: android-qa-once
  cancel-in-progress: true

jobs:
  emulator-baseline:
    name: Inspect emulator before and after known APK
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reuse the previously compiled APK (no Flutter / Gradle build)
        uses: actions/download-artifact@v4
        with:
          name: qa-fixed-android-profile-apk-synthetic-config
          path: ci-apk
          run-id: 42497833782
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify known APK checksum and single-file fixture
        shell: bash
        run: |
          set -euo pipefail
          test "$(find ci-apk -maxdepth 1 -name '*.apk' -type f | wc -l)" -eq 1
          echo '8fca53efd8a5b9f2c061b884914eec65bbd97692e0456d7e04a836ffac9abd2c  ci-apk/app-production-profile.apk' | sha256sum --check
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Observe emulator preflight and known APK startup
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: bash qa/mobile/run-once.sh
      - name: Preserve emulator preflight, UI, and logcat diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-emulator-baseline-previous-apk
          path: qa/mobile/evidence/
          if-no-files-found: warn
          retention-days: 7
