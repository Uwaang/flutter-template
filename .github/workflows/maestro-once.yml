name: One-time FreeRASP vs emulator health diagnostic (SCRUM-435)

on:
  push:
    branches: [qa/scrum-435-maestro-android-once]
    paths:
      - .github/workflows/maestro-once.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-qa-once
  cancel-in-progress: true

jobs:
  mobile-startup:
    name: Trace FreeRASP attach and emulator health
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      FLUTTER_TEMPLATE_COMPILE_ONLY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true
      - run: flutter pub get
      - run: dart run tool/create_ci_env.dart
      - run: python3 tool/prepare_native_ci.py android
      - run: flutter gen-l10n --arb-dir assets/localization --template-arb-file app_en.arb --output-localization-file app_localizations.gen.dart --output-dir lib/assets
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Download and verify pinned Gradle distribution before build
        shell: bash
        run: |
          set -euo pipefail
          zip="$RUNNER_TEMP/gradle-8.14.3-bin.zip"
          expected="bd71102213493060956ec229d946beee57158dbd89d0e62b91bca0fa2c5f3531"

          # These official URLs may redirect to GitHub Releases, which has
          # intermittently returned HTTP 504. Retry downloads rather than
          # relying on a single silent Java Wrapper redirect.
          downloaded=0
          for url in \
            "https://downloads.gradle.org/distributions/gradle-8.14.3-bin.zip" \
            "https://services.gradle.org/distributions/gradle-8.14.3-bin.zip"; do
            if curl --fail --location --show-error --silent \
              --retry 2 --retry-delay 5 --retry-all-errors \
              --connect-timeout 20 --max-time 120 \
              --output "$zip" "$url"; then
              downloaded=1
              break
            fi
            echo "::warning::Gradle download failed from $url; trying another official endpoint"
            rm -f "$zip"
          done
          if [[ "$downloaded" -ne 1 ]]; then
            echo "::error::Could not download Gradle 8.14.3 from official hosts"
            exit 1
          fi
          printf '%s  %s\n' "$expected" "$zip" | sha256sum --check

          # QA runner only: point Wrapper to the *verified local archive*.
          # Keep the repository's Gradle version and file unchanged.
          python3 - <<'PY'
          from pathlib import Path
          import os
          path = Path('android/gradle/wrapper/gradle-wrapper.properties')
          source = path.read_text()
          old = r'distributionUrl=https\://services.gradle.org/distributions/gradle-8.14.3-bin.zip'
          if source.count(old) != 1 or 'distributionSha256Sum=' in source:
              raise SystemExit('Unexpected Gradle wrapper properties; refusing to change')
          zip_path = (Path(os.environ['RUNNER_TEMP']) / 'gradle-8.14.3-bin.zip').resolve()
          uri = zip_path.as_uri().replace(':', r'\:')
          replacement = 'distributionUrl=' + uri
          path.write_text(source.replace(old, replacement).rstrip() + '\n'
              + 'distributionSha256Sum=bd71102213493060956ec229d946beee57158dbd89d0e62b91bca0fa2c5f3531\n')
          print('Gradle Wrapper configured to use locally verified Gradle 8.14.3 ZIP')
          PY
      - name: Build synthetic APK with QA-only startup trace
        run: |
          flutter build apk --profile -t lib/main_production.dart --flavor production --dart-define=QA_STARTUP_TRACE=true
          mkdir -p ci-apk
          cp build/app/outputs/flutter-apk/app-production-profile.apk ci-apk/
          sha256sum ci-apk/*.apk
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify preflight emulator health and trace Android startup
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: bash qa/mobile/run-once.sh
      - name: Upload screenshot and startup trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-android-rasp-emulator-health-evidence
          path: qa/mobile/evidence/
          if-no-files-found: warn
          retention-days: 7
