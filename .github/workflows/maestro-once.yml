name: One-time Android Maestro baseline APK evaluation (SCRUM-435)

on:
  push:
    branches: [qa/scrum-435-maestro-android-once]
    paths:
      - .github/workflows/maestro-once.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  mobile-startup:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download previous known failing APK for baseline detection
        uses: actions/download-artifact@v4
        with:
          name: installable-android-profile-apk-synthetic-config
          path: ci-apk
          run-id: 42389745734
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify downloaded APK
        run: |
          find ci-apk -maxdepth 2 -type f -name '*.apk' -print
          test "$(find ci-apk -type f -name '*.apk' | wc -l)" -eq 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Maestro CLI
        run: |
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch baseline APK and run single Maestro flow
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: |
            set +e
            apk=$(find ci-apk -type f -name '*.apk' | head -n 1)
            adb install -r "$apk"
            install_code=$?
            if [ "$install_code" -eq 0 ]; then
              maestro test qa/mobile/startup.yaml
              result=$?
            else
              result=$install_code
            fi
            mkdir -p qa/mobile/evidence
            adb exec-out screencap -p > qa/mobile/evidence/screenshot.png || true
            adb logcat -d -v time | grep -E 'Flutter|flutter|Firebase|AndroidRuntime|FATAL EXCEPTION|FreeRASP|Talsec|SignIn' | tail -n 500 > qa/mobile/evidence/logcat-excerpt.txt || true
            echo "result=$result" > qa/mobile/evidence/outcome.txt
            exit "$result"
      - name: Upload diagnostic evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: android-maestro-startup-evidence
          path: qa/mobile/evidence/
          if-no-files-found: warn
          retention-days: 7
