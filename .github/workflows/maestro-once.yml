name: One-time Android fixed APK ADB startup evaluation (SCRUM-435)

on:
  push:
    branches: [qa/scrum-435-maestro-android-once]
    paths:
      - .github/workflows/maestro-once.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-qa-once
  cancel-in-progress: true

jobs:
  mobile-startup:
    name: Compile fixed APK and check first screen
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      FLUTTER_TEMPLATE_COMPILE_ONLY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true
      - run: flutter pub get
      - run: dart run tool/create_ci_env.dart
      - run: python3 tool/prepare_native_ci.py android
      - run: flutter gen-l10n --arb-dir assets/localization --template-arb-file app_en.arb --output-localization-file app_localizations.gen.dart --output-dir lib/assets
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Pin official direct Gradle download and verify distribution
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('android/gradle/wrapper/gradle-wrapper.properties')
          data = path.read_text()
          old = r'distributionUrl=https\://services.gradle.org/distributions/gradle-8.14.3-bin.zip'
          new = r'distributionUrl=https\://downloads.gradle.org/distributions/gradle-8.14.3-bin.zip'
          if data.count(old) != 1 or 'distributionSha256Sum=' in data:
              raise SystemExit('Unexpected Gradle wrapper properties; refusing to change')
          # Test-runner-only override: keep repository's pinned Gradle version.
          # Checksum: https://gradle.org/release-checksums/ (Gradle 8.14.3 bin).
          path.write_text(data.replace(old, new).rstrip() + '\n'
              + 'distributionSha256Sum=bd71102213493060956ec229d946beee57158dbd89d0e62b91bca0fa2c5f3531\n')
          print('Gradle 8.14.3 official direct CDN + SHA-256 verification configured')
          PY
      - name: Build updated profile APK (synthetic Firebase, debug signed)
        run: |
          set -euo pipefail
          flutter build apk --profile -t lib/main_production.dart --flavor production
          mkdir -p ci-apk
          cp build/app/outputs/flutter-apk/app-production-profile.apk ci-apk/
          sha256sum ci-apk/*.apk
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch updated APK and verify UI with ADB
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: bash qa/mobile/run-once.sh
      - name: Upload APK for independent manual inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-fixed-android-profile-apk-synthetic-config
          path: ci-apk/*.apk
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload ADB diagnostics including screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-fixed-android-adb-evidence
          path: qa/mobile/evidence/
          if-no-files-found: warn
          retention-days: 7
