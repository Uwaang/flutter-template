# SCRUM-437 single-use live Web auth E2E. REMOVE after the test run.
# Only a publishable client key is used, NEVER a secret/service-role key.
name: SCRUM-437 live Web auth once
on:
  push:
    branches: [feat/scrum-437-supabase-first]
    paths:
      - .github/workflows/scrum-437-live-web-once.yml
      - qa/web/live-auth.spec.js
      - qa/web/spa_server.py
permissions:
  contents: read
jobs:
  live-web-auth:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      RUN_SUPABASE_WEB_LIVE: '1'
      SUPABASE_URL: https://rfgdugcegitcfxblskwo.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_lS8D4KJhVTEDJ4Soo93flA_7R15HxVN
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true
      - run: flutter pub get
      - run: dart run tool/create_ci_env.dart
      - name: Fill public-only Supabase test configuration
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          project_url = os.environ["SUPABASE_URL"]
          public_key = os.environ["SUPABASE_PUBLISHABLE_KEY"]
          if not project_url.startswith("https://") or not public_key.startswith("sb_publishable_"):
              raise SystemExit("Refusing non-publishable or malformed Supabase configuration")
          for filename in (".env", ".env-production"):
              p = Path(filename)
              text = p.read_text()
              for original, updated in (
                  ("SUPABASE_URL=\n", f"SUPABASE_URL={project_url}\n"),
                  ("SUPABASE_PUBLISHABLE_KEY=\n", f"SUPABASE_PUBLISHABLE_KEY={public_key}\n"),
              ):
                  if text.count(original) != 1:
                      raise SystemExit(f"Expected a single placeholder in {filename}")
                  text = text.replace(original, updated)
              p.write_text(text)
          print("Configured disposable QA project using public publishable key")
          PY
      - run: flutter gen-l10n --arb-dir assets/localization --template-arb-file app_en.arb --output-localization-file app_localizations.gen.dart --output-dir lib/assets
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build web --release -t lib/main_production.dart
      - name: Playwright dependencies and chromium
        working-directory: qa/web
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Live auth browser session and reload test
        working-directory: qa/web
        run: npx playwright test live-auth.spec.js
      - name: Failure evidence without tokens
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scrum-437-live-web-diagnostics
          path: |
            qa/web/playwright-report/
            qa/web/test-results/
          retention-days: 3
          if-no-files-found: warn
