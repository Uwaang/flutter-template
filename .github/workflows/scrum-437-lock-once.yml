name: Generate Supabase migration lockfile (SCRUM-437 one-time)

on:
  push:
    branches: [feat/scrum-437-supabase-first]
    paths:
      - pubspec.yaml
      - .github/workflows/scrum-437-lock-once.yml

permissions:
  contents: read

jobs:
  lockfile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true
      - run: flutter pub get
      - name: Upload resolved lockfile for reviewed commit
        uses: actions/upload-artifact@v4
        with:
          name: scrum-437-resolved-pubspec-lock
          path: pubspec.lock
          retention-days: 3
          if-no-files-found: error
