name: Temporary Dart format diff (SCRUM-450)

on:
  push:
    branches: [feat/scrum-450-auth-material3-ui-20261118]
    paths:
      - '.github/workflows/scrum-450-format-probe.yml'

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true
      - run: |
          dart format lib/features/authentication/authentication_page_content.dart
          git --no-pager diff -- lib/features/authentication/authentication_page_content.dart
