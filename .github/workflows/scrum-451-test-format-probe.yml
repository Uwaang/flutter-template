name: SCRUM-451 temporary test formatting probe
on:
  push:
    branches: [refactor/scrum-451-drop-strv-legacy-20261119]
    paths:
      - '.github/workflows/scrum-451-test-format-probe.yml'
permissions:
  contents: read
jobs:
  test-format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true
      - run: flutter pub get
      - run: |
          dart format test/common/profile_circle_avatar_test.dart
          git --no-pager diff -- test/common/profile_circle_avatar_test.dart
